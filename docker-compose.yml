# Postgres + the API/dashboard + three workers.
#
#   docker compose up --build
#   open http://localhost:8000
#   docker compose kill worker   # kill workers mid-run, then `docker compose up -d worker` and watch runs resume
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ninelives
      POSTGRES_PASSWORD: ninelives
      POSTGRES_DB: ninelives
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninelives"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      NINELIVES_DB: postgresql://ninelives:ninelives@postgres:5432/ninelives
      APP: examples/shop.py:app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: ["sh", "-c", "exec ninelives worker \"$$APP\" --lease-ttl 5"]
    environment:
      NINELIVES_DB: postgresql://ninelives:ninelives@postgres:5432/ninelives
      APP: examples/shop.py:app
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 3
    stop_grace_period: 15s

volumes:
  pgdata:
