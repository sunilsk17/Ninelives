[project]
name = "ninelives"
version = "0.2.0"
description = "Durable execution for Python workflows and AI agents: survive crashes, resume from the last step, never repeat a paid LLM call."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sunil Kumar" }]
keywords = ["durable-execution", "workflows", "workflow-engine", "ai-agents", "llm", "postgres", "sqlite", "fault-tolerance", "cron", "asyncio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sunilsk17/Ninelives"
Documentation = "https://github.com/sunilsk17/Ninelives/tree/main/docs"
Changelog = "https://github.com/sunilsk17/Ninelives/blob/main/CHANGELOG.md"
Issues = "https://github.com/sunilsk17/Ninelives/issues"

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
server = ["fastapi>=0.115", "uvicorn>=0.32"]
agents = ["anthropic>=1.0", "httpx>=0.27"]
otel = ["opentelemetry-api>=1.20"]
all = ["ninelives[postgres,server,agents,otel]"]

[project.scripts]
ninelives = "ninelives.cli:main"

[dependency-groups]
dev = [
  "ninelives[all]",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ninelives"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "postgres: needs a Postgres server (NINELIVES_TEST_POSTGRES_DSN)",
  "chaos: multi-process crash tests (slower)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# Code samples in the docs are hand-formatted prose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "B008", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Tests and benchmarks poll a database from outside on purpose.
"tests/*" = ["ASYNC110"]
"benchmarks/*" = ["ASYNC110", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
packages = ["ninelives"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "uvicorn"]
ignore_missing_imports = true
