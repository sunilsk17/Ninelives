name: Release

# Builds the wheel and sdist and attaches them to the GitHub release. Either push a tag like
# v0.2.0 (the release is created for you), or publish a release with a new v* tag on GitHub's
# Releases page (the files are added to it). Running twice is harmless.
# Publishing to PyPI is off until you configure it: add PyPI as a trusted publisher for this
# repository (workflow release.yml, environment "pypi") and set the repository variable
# PUBLISH_TO_PYPI to "true".

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv build
      - name: Check the distributions
        run: uvx twine check --strict dist/*
      - name: The wheel installs and imports, with and without extras
        run: |
          uv venv /tmp/core && uv pip install --python /tmp/core dist/*.whl
          /tmp/core/bin/python -c "import ninelives; print('core', ninelives.__version__)"
          uv venv /tmp/full && uv pip install --python /tmp/full "$(ls dist/*.whl)[all]"
          /tmp/full/bin/python -c "import ninelives.server, ninelives.agents, ninelives.stores.postgres; print('all extras ok')"
          /tmp/full/bin/ninelives --version
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist
      - name: Create the GitHub release, or add the files to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed."
          fi

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
